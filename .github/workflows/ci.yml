name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'yourdockerhub' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        env:
          JWT_SECRET: ci-test-secret
          APP_ENV: test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  code-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test runner
        working-directory: code-runner
        run: |
          pip install pytest
          PYTHONPATH=../backend pytest -q

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, code-runner]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        env:
          SHA: ${{ github.sha }}
          NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -t "$NS/interview-anvil-api:$SHA" -t "$NS/interview-anvil-api:latest" ./backend
          docker build -t "$NS/interview-anvil-frontend:$SHA" -t "$NS/interview-anvil-frontend:latest" ./frontend
          docker build -t "$NS/interview-anvil-java-runner:$SHA" -t "$NS/interview-anvil-java-runner:latest" ./code-runner/java
          docker push "$NS/interview-anvil-api:$SHA"
          docker push "$NS/interview-anvil-api:latest"
          docker push "$NS/interview-anvil-frontend:$SHA"
          docker push "$NS/interview-anvil-frontend:latest"
          docker push "$NS/interview-anvil-java-runner:$SHA"
          docker push "$NS/interview-anvil-java-runner:latest"
