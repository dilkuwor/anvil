name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force build and push all Docker images"
        required: true
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'yourdockerhub' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Test
        env:
          JWT_SECRET: ci-test-secret
          APP_ENV: test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  code-runner:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test runner
        working-directory: code-runner
        run: |
          pip install pytest
          PYTHONPATH=../backend pytest -q

  images:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'

    needs: [backend, frontend, code-runner]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed images
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
        run: |
          set -euo pipefail

          backend=false
          frontend=false
          runner=false

          if [ "$FORCE_ALL" = "true" ]; then
            echo "Force build enabled: building all images"
            backend=true
            frontend=true
            runner=true

          elif [ -z "${BEFORE:-}" ] || \
               [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit detected: building all images"
            backend=true
            frontend=true
            runner=true

          else
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"

            echo "Changed files:"
            echo "$changed"

            echo "$changed" | grep -q '^backend/' && backend=true || true
            echo "$changed" | grep -q '^frontend/' && frontend=true || true
            echo "$changed" | grep -q '^code-runner/' && runner=true || true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

          if [ "$backend" = "true" ] || \
             [ "$frontend" = "true" ] || \
             [ "$runner" = "true" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.any == 'true'

      - uses: docker/login-action@v3
        if: steps.changes.outputs.any == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        if: steps.changes.outputs.backend == 'true'
        env:
          SHA: ${{ github.sha }}
          NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build \
            -t "$NS/interview-anvil-api:$SHA" \
            -t "$NS/interview-anvil-api:latest" \
            ./backend

          docker push "$NS/interview-anvil-api:$SHA"
          docker push "$NS/interview-anvil-api:latest"

      - name: Build and push frontend
        if: steps.changes.outputs.frontend == 'true'
        env:
          SHA: ${{ github.sha }}
          NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build \
            -t "$NS/interview-anvil-frontend:$SHA" \
            -t "$NS/interview-anvil-frontend:latest" \
            ./frontend

          docker push "$NS/interview-anvil-frontend:$SHA"
          docker push "$NS/interview-anvil-frontend:latest"

      - name: Build and push Java runner
        if: steps.changes.outputs.runner == 'true'
        env:
          SHA: ${{ github.sha }}
          NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build \
            -t "$NS/interview-anvil-java-runner:$SHA" \
            -t "$NS/interview-anvil-java-runner:latest" \
            ./code-runner/java

          docker push "$NS/interview-anvil-java-runner:$SHA"
          docker push "$NS/interview-anvil-java-runner:latest"